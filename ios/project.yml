name: OPKTerminal
options:
  bundleIdPrefix: com.openpasskey
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  OPKTerminalSDK:
    path: .
targets:
  OPKTerminalApp:
    type: application
    platform: iOS
    supportedDestinations: [iOS, iPad]
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/PrivacyInfo.xcprivacy
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Import contract and token addresses from Settings QR codes. Payment QR payloads are rejected and not imported.
        NSFaceIDUsageDescription: Authenticate access to the device-local settlement operator key before signing a sweep transaction.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: OPKTerminalSDK
        product: OPKTerminalCore
      - package: OPKTerminalSDK
        product: OPKTerminalRPC
      - package: OPKTerminalSDK
        product: OPKTerminalOperator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openpasskey.terminal.ios
        PRODUCT_NAME: OPK Terminal
        MARKETING_VERSION: 0.1.2
        CURRENT_PROJECT_VERSION: 3
        DEVELOPMENT_TEAM: 3272Q6WG52
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
schemes:
  OPKTerminalApp:
    build:
      targets:
        OPKTerminalApp: all
    run:
      config: Debug
    archive:
      config: Release
